<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llista de regals d'aniversari</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #bfe3ff, #7fb7f0);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .targeta {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(10, 60, 120, 0.25);
      padding: 28px 32px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      text-align: center;
      color: #1565c0;
      margin-top: 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin: 10px 0;
    }
    li:nth-child(1) label { background: #e3f2fd; }
    li:nth-child(2) label { background: #d0e8fb; }
    li:nth-child(3) label { background: #bbdefb; }
    li:nth-child(4) label { background: #d6f0ff; }
    li:nth-child(5) label { background: #c5d9f5; }
    label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      color: #0d2b4e;
      transition: transform 0.15s;
    }
    label:hover {
      transform: scale(1.03);
    }
    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #1565c0;
      cursor: pointer;
    }
    input[type="checkbox"]:checked + span {
      text-decoration: line-through;
      color: #7a8ca3;
    }
  </style>
</head>
<body>
  <div class="targeta">
    <h1>🎁 Regals d'aniversari 🎉</h1>
    <ul>
      <li><label><input type="checkbox"><span>🚵 Casc de bici de muntanya</span></label></li>
      <li><label><input type="checkbox"><span>👕 Roba</span></label></li>
      <li><label><input type="checkbox"><span> Colònia</span></label></li>
      <li><label><input type="checkbox"><span>💳 Recàrrega de diners a la targeta</span></label></li>
      <li><label><input type="checkbox"><span>🎒 Motxilla per anar amb bici</span></label></li>
    </ul>
  </div>

  <script>
    const caselles = document.querySelectorAll('input[type="checkbox"]');
    const clau = 'regals-marcats';

    // Recuperar les marques guardades en aquest navegador
    try {
      const guardat = JSON.parse(localStorage.getItem(clau) || '[]');
      caselles.forEach((c, i) => { c.checked = guardat[i] === true; });
    } catch (e) {}

    // Guardar cada vegada que es marca o desmarca
    caselles.forEach(c => {
      c.addEventListener('change', () => {
        try {
          localStorage.setItem(clau, JSON.stringify([...caselles].map(x => x.checked)));
        } catch (e) {}
      });
    });
  </script>
</body>
</html>
